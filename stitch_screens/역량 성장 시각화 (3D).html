<canvas id="shader-canvas-ANIMATION_54" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_54');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    
    // Deep dark background with subtle moving violet glow
    vec3 color1 = vec3(0.02, 0.01, 0.05); // Near black violet
    vec3 color2 = vec3(0.05, 0.02, 0.12); // Deep dark violet
    vec3 accent = vec3(0.48, 0.36, 0.94); // #7B5CF0
    
    float noise = sin(uv.x * 2.0 + u_time * 0.2) * cos(uv.y * 2.5 + u_time * 0.3);
    float glow = smoothstep(1.0, 0.0, length(uv - vec2(0.5, 0.7)));
    
    vec3 finalColor = mix(color1, color2, uv.y + noise * 0.05);
    finalColor += accent * glow * 0.1; // Atmospheric glow
    
    gl_FragColor = vec4(finalColor, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div id="threejs-container-ANIMATION_55" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_55');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_N'); // Placeholder ID handled by system
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x7B5CF0, 2, 50);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  // Radar Chart Data
  const categories = 5;
  const radius = 2.5;
  const points = [];
  const targetValues = [0.8, 0.9, 0.7, 0.85, 0.6]; // Mock data
  let currentValues = [0, 0, 0, 0, 0];

  const group = new THREE.Group();
  scene.add(group);

  // Grid / Web structure
  const gridMat = new THREE.LineBasicMaterial({ color: 0x7B5CF0, transparent: true, opacity: 0.2 });
  for(let i = 1; i <= 4; i++) {
    const ringGeom = new THREE.CircleGeometry(radius * (i/4), categories);
    ringGeom.vertices.shift(); // Remove center vertex
    const ring = new THREE.LineLoop(ringGeom, gridMat);
    ring.rotation.x = Math.PI / 2;
    group.add(ring);
  }

  // Spoke lines
  for(let i = 0; i < categories; i++) {
    const angle = (i / categories) * Math.PI * 2;
    const points = [];
    points.push(new THREE.Vector3(0, 0, 0));
    points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
    const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(lineGeom, gridMat);
    group.add(line);
  }

  // Data Shape (Curved Area)
  const shapeGeom = new THREE.BufferGeometry();
  const shapeMat = new THREE.MeshPhongMaterial({ 
    color: 0x7B5CF0, 
    side: THREE.DoubleSide, 
    transparent: true, 
    opacity: 0.5,
    shininess: 100
  });
  const shape = new THREE.Mesh(shapeGeom, shapeMat);
  group.add(shape);

  // Glowing points (Spheres)
  const sphereGeom = new THREE.SphereGeometry(0.12, 16, 16);
  const sphereMat = new THREE.MeshPhongMaterial({ 
    color: 0xffffff, 
    emissive: 0x7B5CF0, 
    emissiveIntensity: 1 
  });
  const pointMeshes = [];
  for(let i = 0; i < categories; i++) {
    const mesh = new THREE.Mesh(sphereGeom, sphereMat);
    pointMeshes.push(mesh);
    group.add(mesh);
  }

  camera.position.set(0, 4, 6);
  camera.lookAt(0, 0, 0);

  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    
    // Animate values growth
    for(let i = 0; i < categories; i++) {
      currentValues[i] += (targetValues[i] - currentValues[i]) * 0.05;
      const val = currentValues[i] * radius;
      const angle = (i / categories) * Math.PI * 2;
      
      const x = Math.cos(angle) * val;
      const z = Math.sin(angle) * val;
      const y = Math.sin(t * 2 + i) * 0.1; // Gentle bounce
      
      pointMeshes[i].position.set(x, y, z);
    }

    // Update shape geometry
    const vertices = [];
    const center = new THREE.Vector3(0, 0, 0);
    for(let i = 0; i < categories; i++) {
      const p1 = pointMeshes[i].position;
      const p2 = pointMeshes[(i + 1) % categories].position;
      vertices.push(center.x, center.y, center.z);
      vertices.push(p1.x, p1.y, p1.z);
      vertices.push(p2.x, p2.y, p2.z);
    }
    shapeGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    shapeGeom.computeVertexNormals();

    group.rotation.y = t * 0.2;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();

})();
</script>

<script>
        // Auto-advance logic for code input slots
        const inputs = document.querySelectorAll('.code-input-slot');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only uppercase alphanumeric
                input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text').toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (pastedData) {
                    for (let i = 0; i < Math.min(pastedData.length, inputs.length - index); i++) {
                        inputs[index + i].value = pastedData[i];
                    }
                    if (index + pastedData.length < inputs.length) {
                        inputs[index + pastedData.length].focus();
                    } else {
                        inputs[inputs.length - 1].focus();
                    }
                }
            });
        });
    </script>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_36 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_36" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_36');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x7B5CF0, 2, 50);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Cybersecurity related 3D object: A floating digital shield/lock
const group = new THREE.Group();
scene.add(group);

// Shield Body
const shieldGeom = new THREE.CylinderGeometry(1, 1.2, 0.4, 6);
const shieldMat = new THREE.MeshPhongMaterial({ 
  color: 0x7B5CF0, 
  shininess: 100,
  transparent: true,
  opacity: 0.9
});
const shield = new THREE.Mesh(shieldGeom, shieldMat);
shield.rotation.x = Math.PI / 2;
group.add(shield);

// Inner Core (Glowing)
const coreGeom = new THREE.SphereGeometry(0.5, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
const core = new THREE.Mesh(coreGeom, coreMat);
group.add(core);

// Floating Bits
for(let i=0; i<8; i++) {
  const bitGeom = new THREE.BoxGeometry(0.1, 0.1, 0.1);
  const bitMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
  const bit = new THREE.Mesh(bitGeom, bitMat);
  const angle = (i / 8) * Math.PI * 2;
  bit.position.set(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, 0);
  group.add(bit);
}

camera.position.z = 5;

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  
  group.rotation.y = t * 0.5;
  group.rotation.z = Math.sin(t * 0.3) * 0.2;
  group.position.y = Math.sin(t * 1.5) * 0.2;
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_36 -->
</body>
</html>

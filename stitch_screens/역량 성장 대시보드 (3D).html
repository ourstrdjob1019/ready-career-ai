<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
(function() {
  const container = document.getElementById('threejs-container-growth-dashboard');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x7B5CF0, 1.5, 50);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  const group = new THREE.Group();
  scene.add(group);

  // 1. Donut Chart (Main Achievement)
  const donutGroup = new THREE.Group();
  donutGroup.position.y = 1.5;
  group.add(donutGroup);

  const innerRadius = 1.5;
  const outerRadius = 2.0;
  const depth = 0.6;
  
  // Progress part (Blue)
  const progressPercent = 0.75;
  const progressGeom = new THREE.TorusGeometry(1.7, 0.3, 16, 100, Math.PI * 2 * progressPercent);
  const progressMat = new THREE.MeshPhongMaterial({ 
    color: 0x7B5CF0, 
    shininess: 100,
    emissive: 0x4a21be,
    emissiveIntensity: 0.2
  });
  const progressMesh = new THREE.Mesh(progressGeom, progressMat);
  progressMesh.rotation.z = Math.PI / 2;
  donutGroup.add(progressMesh);

  // Background part (Light Grey/White)
  const bgGeom = new THREE.TorusGeometry(1.7, 0.3, 16, 100);
  const bgMat = new THREE.MeshPhongMaterial({ 
    color: 0xffffff, 
    transparent: true, 
    opacity: 0.1,
    shininess: 100 
  });
  const bgMesh = new THREE.Mesh(bgGeom, bgMat);
  donutGroup.add(bgMesh);

  // 2. Bar Graphs (Habit Rates)
  const barGroup = new THREE.Group();
  barGroup.position.y = -2.0;
  group.add(barGroup);

  const bars = [];
  const barCount = 5;
  const barSpacing = 1.2;
  const heights = [2.5, 1.8, 2.2, 1.2, 2.8];

  for(let i = 0; i < barCount; i++) {
    const h = heights[i];
    const barGeom = new THREE.BoxGeometry(0.6, h, 0.6);
    const barMat = new THREE.MeshPhongMaterial({ 
      color: 0xADC1FF,
      shininess: 100,
      transparent: true,
      opacity: 0.9
    });
    const bar = new THREE.Mesh(barGeom, barMat);
    bar.position.x = (i - (barCount-1)/2) * barSpacing;
    bar.position.y = h / 2;
    barGroup.add(bar);
    bars.push({ mesh: bar, targetH: h, currentH: 0 });
  }

  camera.position.z = 8;

  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    
    // Animate donut
    donutGroup.rotation.y = Math.sin(t * 0.5) * 0.2;
    donutGroup.rotation.x = Math.cos(t * 0.3) * 0.1;

    // Animate bars
    bars.forEach((b, i) => {
      b.mesh.scale.y = 1 + Math.sin(t * 2 + i) * 0.05;
      b.mesh.position.y = (b.targetH * b.mesh.scale.y) / 2;
    });

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();

})();
</script>

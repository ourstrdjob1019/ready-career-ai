<div class="absolute right-0 top-0 h-full w-4 bg-white/50 rounded-full progress-glow blur-[2px]"></div>

<div class="w-full bg-surface-container-lowest rounded-xl shadow-float p-8 mb-8 text-center flex flex-col items-center relative z-10 glass-panel">

</div>

<span class="text-body-md font-body-md font-bold z-10">명단에서 빼고 제출한다</span>
<!-- Subtle gradient overlay -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
</button>

<!-- Script to handle dynamic icon filling (optional enhancement based on JSON logic) -->
<script>
        // Ensure material symbols script is applied correctly.
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('[data-icon]');
            icons.forEach(icon => {
                if(!icon.textContent) {
                    icon.textContent = icon.getAttribute('data-icon');
                }
            });
        });

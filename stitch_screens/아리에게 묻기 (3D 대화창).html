<style>
        body {

            background-color: #fdf8ff;

        .glass-card {

        }

        }

        .primary-gradient {
            background: linear-gradient(135deg, #7b5cf0 0%, #6240d5 100%);
            box-shadow: inset 0px 1px 0px rgba(255, 255, 255, 0.4);
        }

            background: #f1ebf8;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.03), inset -2px -2px 5px rgba(255, 255, 255, 0.8);

            height: 20px;

<script>
        // Smooth entrance for messages
        document.addEventListener('DOMContentLoaded', () => {
            const messages = document.querySelectorAll('.animate-in');
            messages.forEach((msg, index) => {
                msg.style.animationDelay = `${index * 150}ms`;
            });
        });

        // Interactivity for buttons
        const sendBtn = document.querySelector('.primary-gradient');
        sendBtn.addEventListener('click', function() {
            // Placeholder for interaction
            this.classList.add('scale-95');
            setTimeout(() => this.classList.remove('scale-95'), 100);
        });
    </script>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .shadow-base {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .shadow-ambient {
            box-shadow: 0px 20px 40px rgba(123, 92, 240, 0.15);
        }
        .shadow-stacked {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0px 20px 40px rgba(123, 92, 240, 0.15);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            border-left: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        
        .btn-bezel {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0px 10px 20px rgba(123, 92, 240, 0.2);
            transition: all 0.2s ease-in-out;
        }
        .btn-bezel:hover {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 6px 8px -1px rgba(0, 0, 0, 0.15), 0px 15px 25px rgba(123, 92, 240, 0.3);
            transform: translateY(-2px);
        }
        
        .input-inset {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        /* 3D Constellation Map Styles */
        .space-window {
            background: radial-gradient(circle at 50% 50%, #2a1659 0%, #11052c 100%);
            box-shadow: inset 0 0 50px rgba(123, 92, 240, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .star-node {
            position: absolute;
            border-radius: 50%;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .star-completed {
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset -3px -3px 5px rgba(0,0,0,0.3);
            animation: pulse-gold 3s infinite alternate;
        }
        
        .star-current {
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.8), inset -4px -4px 8px rgba(0,0,0,0.2);
            animation: float-white 4s infinite ease-in-out;
            z-index: 20;
            transform: scale(1.2);
        }
        
        .star-future {
            background: radial-gradient(circle at 30% 30%, #a0a0a0, #505050);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
            opacity: 0.7;
        }

        .star-label {
            position: absolute;
            bottom: -24px;
            white-space: nowrap;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .star-node:hover .star-label,
        .star-current .star-label {
            opacity: 1;
        }

        .tube-line {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,215,0,0.5) 0%, rgba(123,92,240,0.3) 100%);
            border-radius: 2px;
            transform-origin: 0 50%;
            z-index: 5;
            box-shadow: 0 0 8px rgba(123,92,240,0.4);
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), inset -3px -3px 5px rgba(0,0,0,0.3); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset -3px -3px 5px rgba(0,0,0,0.3); transform: scale(1.05); }
        }
        
        @keyframes float-white {
            0%, 100% { transform: translateY(0) scale(1.2); }
            50% { transform: translateY(-10px) scale(1.2); }
        }

        /* Helper Card Bevel */
        .helper-card-bevel {
            background: theme('colors.surface');
            border-radius: theme('borderRadius.xl');
            box-shadow: 
                0 -4px 10px rgba(0,0,0,0.05),
                0px 20px 40px rgba(123, 92, 240, 0.15),
                inset 0 2px 0 rgba(255,255,255,0.8),
                inset 0 -2px 0 rgba(0,0,0,0.05);
            border: 1px solid theme('colors.surface-variant');
        }

        /* Subtle Background pattern */
        .bg-pattern {
            background-image: radial-gradient(rgba(123, 92, 240, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>

<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, (container.clientWidth || window.innerWidth) / (container.clientHeight || window.innerHeight), 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

// Group to hold the mascot
const mascot = new THREE.Group();
scene.add(mascot);

// Body
const bodyGeom = new THREE.SphereGeometry(1, 32, 32);
const material = new THREE.MeshPhongMaterial({ color: 0xADC1FF }); // Soft blue matching 'Ari'
const body = new THREE.Mesh(bodyGeom, material);
body.scale.set(1, 1.2, 0.8);
mascot.add(body);

// Head
const headGeom = new THREE.SphereGeometry(0.8, 32, 32);
const head = new THREE.Mesh(headGeom, material);
head.position.y = 1.3;
mascot.add(head);

// Ears (Fluffy style)
const earGeom = new THREE.CapsuleGeometry(0.3, 0.5, 4, 12);
const leftEar = new THREE.Mesh(earGeom, material);
leftEar.position.set(-0.7, 1.5, 0);
leftEar.rotation.z = Math.PI / 4;
mascot.add(leftEar);

const rightEar = new THREE.Mesh(earGeom, material);
rightEar.position.set(0.7, 1.5, 0);
rightEar.rotation.z = -Math.PI / 4;
mascot.add(rightEar);

// Simple glasses for 'Ari'
const glassesGeom = new THREE.TorusGeometry(0.2, 0.03, 16, 32);
const glassesMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const leftGlass = new THREE.Mesh(glassesGeom, glassesMat);
leftGlass.position.set(-0.25, 1.35, 0.7);
head.add(leftGlass);

const rightGlass = new THREE.Mesh(glassesGeom, glassesMat);
rightGlass.position.set(0.25, 1.35, 0.7);
head.add(rightGlass);

camera.position.z = 5;
camera.position.y = 0.5;

// Animation
let clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    
    mascot.rotation.y = Math.sin(t * 0.5) * 0.2;
    mascot.position.y = Math.sin(t * 2) * 0.1;
    
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
});
})();
</script>

<script>
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.classList.add('absolute', 'bg-white/30', 'rounded-full', 'animate-ping');
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.left = `${e.clientX - elem.getBoundingClientRect().left - 10}px`;
                ripple.style.top = `${e.clientY - elem.getBoundingClientRect().top - 10}px`;
                elem.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
